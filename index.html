<!DOCTYPE html>
<html lang="jp">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>getAllYouTubeVideo</title>
    <script src="https://apis.google.com/js/api.js"></script>
    <script type="module" src="/src/main.js"></script>
  </head>

  <body>
    <div id="app">
      <!-- Top View -->
      <form>
        <h1>GET ALL YOUTUBE VIDEOS FOR A SPECIFIC USER</h1>
        <input name="channelid" type="text" placeholder="チャンネルID">
        <input type="button" data-func="search" value="search">

        <p class="validation-message"></p>
      </form>

      <!-- Result View -->
      <div class="view-area"> </div>

      <!-- Blocker -->
      <div class="blocker" data-busy="false">
        <!-- Loading Spinner -->
        <div class="lds-ring"><div></div><div></div><div></div><div></div></div>
      </div>
    </div>
  </body>
</html>
