<!DOCTYPE html>
<html lang="jp">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>getAllYouTubeVideo</title>
    <script src="https://apis.google.com/js/api.js"></script>
    <script type="module" src="/src/main.js"></script>
  </head>

  <body>
    <div id="app">
      <!-- Top View -->
      <form data-visible="visible">
        <h1>GET ALL YOUTUBE VIDEOS FOR A SPECIFIC USER</h1>

        <div>
          <input name="channelid" type="text" placeholder="チャンネルID">
          <input class="button-search" type="button" data-func="search" value="SEARCH">
        </div>

        <p class="validation-message"></p>
      </form>

      <!-- Result View -->
      <div class="view-area">
        <div class="reel base-info-area">
          <!-- <div class="card">
            <h3>全動画 合計時間</h3>
            <p>1400時間35分30秒</p>
          </div>
          <div class="card"></div> -->
        </div>
      </div>

      <!-- Blocker -->
      <div class="blocker" data-busy="false">
        <!-- Loading Spinner -->
        <div class="lds-ring"><div></div><div></div><div></div><div></div></div>
      </div>
    </div>
  </body>
</html>
